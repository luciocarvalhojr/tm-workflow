# This is a shared workflow to be used across the organisation

name: Deployment via SSM

on:
  workflow_call:
    inputs:
      config-path:
        required: true
        type: string
      aws-region:
        required: false
        type: string
      aws-access-key-id:
        required: true
        type: string
      aws-ssm-bucket:
        required: true
        type: string
      tm-instance-id:
        required: true
        type: string
      server_username:
        required: true
        type: string
      projet_client:
        required: true
        type: string
    secrets:
      token:
        required: true
      aws-access-key:
        required: true

jobs:
  Deploy:
    runs-on: ubuntu-latest
    container:
      image: serversideup/ansible
    env:
      AWS_SSM_BUCKET: ${{ inputs.aws-ssm-bucket }}
      TM_INSTANCE_ID: ${{ inputs.tm-instance-id }}
      SERVER_USERNAME: ${{ inputs.server_username }}
      PROJET_CLIENT: ${{ inputs.projet_client }}
    steps:
    - name: Checkout client repo
      uses: actions/checkout@v3
    - uses: actions/labeler@v6
      with:
        repo-token: ${{ secrets.token }}
        configuration-path: ${{ inputs.config-path }}
    - name: Setup AWS CLI
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ${{ inputs.aws-region || 'ca-central-1' }}
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ secrets.aws-access-key }}
    - name: Clone tm-ansible repo
      run: |
        git clone https://github.com/toumoro/tm-ansible.git tm-ansible
        mv tm-ansible/ansible.cfg .
    - name: Prepare Runner
      run: |
        ansible-playbook tm-ansible/playbooks/prepare-github-runner.yml
    - name: Deploy Docker
      run: |
        ansible-playbook -i tm-ansible/inventory/aws_ec2.yml \
            tm-ansible/playbooks/docker-deploy.yml \
            -e "ansible_aws_ssm_bucket_name=${AWS_SSM_BUCKET}"
    - name: Deploy Traefik
      run: |
        ansible-playbook -i tm-ansible/inventory/aws_ec2.yml \
            tm-ansible/playbooks/traefik-deploy.yml \
            -e "ansible_aws_ssm_bucket_name=${AWS_SSM_BUCKET}"
